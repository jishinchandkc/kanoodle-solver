<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pebblepack</title>
<meta name="description" content="Pebblepack: a packing puzzle. Fit every stone onto the wooden board with no gaps and no overlaps.">
<style>
  :root {
    --pp-ground: #ecebe7;
    --pp-card: #fbfaf7;
    --pp-ink: #26211b;
    --pp-ink-soft: #6b6257;
    --pp-line: #d9d3c9;
    --pp-accent: #ff9f1c;
    --pp-accent-ink: #1a1200;
    --pp-wood: #c98b4f;
    --pp-wood-hi: #dfa96d;
    --pp-grain: 110, 55, 20;          /* rgb of the grain lines and knots */
    --pp-well: #74431f;
    --pp-display: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Varela Round", "Nunito", system-ui, sans-serif;
    --pp-body: system-ui, "Segoe UI", -apple-system, sans-serif;
    --pp-mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --pp-ground: #1a1613;
      --pp-card: #25201b;
      --pp-ink: #f2ede6;
      --pp-ink-soft: #b2a798;
      --pp-line: #3a322a;
      --pp-accent: #ffb341;
      --pp-accent-ink: #1a1200;
    }
  }
  :root[data-theme="dark"] {
    --pp-ground: #1a1613; --pp-card: #25201b; --pp-ink: #f2ede6; --pp-ink-soft: #b2a798;
    --pp-line: #3a322a; --pp-accent: #ffb341; --pp-accent-ink: #1a1200;
  }
  :root[data-theme="light"] {
    --pp-ground: #ecebe7; --pp-card: #fbfaf7; --pp-ink: #26211b; --pp-ink-soft: #6b6257;
    --pp-line: #d9d3c9; --pp-accent: #ff9f1c; --pp-accent-ink: #1a1200;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--pp-ground);
    color: var(--pp-ink);
    font: 16px/1.5 var(--pp-body);
    display: flex;
    justify-content: center;
    padding: 24px 16px 48px;
  }
  main { width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 20px; }

  /* ---- Header ---- */
  .pp-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 20px; }
  .pp-title {
    margin: 0;
    font-family: var(--pp-display);
    font-size: clamp(34px, 8vw, 46px);
    font-weight: 800;
    letter-spacing: -0.015em;
    line-height: 1;
  }
  .pp-title .pip {
    display: inline-block; width: .3em; height: .26em; margin-left: .06em;
    background: var(--pp-accent);
    border-radius: 48% 52% 45% 55% / 55% 45% 55% 45%;
    transform: rotate(-12deg);
  }
  .pp-sub { margin: 6px 0 0; color: var(--pp-ink-soft); max-width: 46ch; }
  .pp-stats { display: flex; gap: 18px; font-size: 14px; color: var(--pp-ink-soft); }
  .pp-stats b {
    display: block;
    font-family: var(--pp-mono);
    font-variant-numeric: tabular-nums;
    font-size: 20px;
    font-weight: 600;
    color: var(--pp-ink);
  }

  /* ---- Wooden board ---- */
  .pp-wood {
    --gap: clamp(3px, 1.1vw, 8px);
    /* A soft sheen, two knots, long grain lines, then the base tone. */
    background:
      linear-gradient(180deg, rgba(255,240,210,.28), transparent 35%, rgba(60,25,0,.12)),
      radial-gradient(ellipse 9% 5% at 71% 37%, rgba(var(--pp-grain), .45), rgba(var(--pp-grain), .12) 60%, transparent 75%),
      radial-gradient(ellipse 16% 8% at 71% 37%, transparent 55%, rgba(var(--pp-grain), .14) 62%, transparent 74%),
      radial-gradient(ellipse 6% 3.5% at 18% 78%, rgba(var(--pp-grain), .35), transparent 75%),
      repeating-linear-gradient(178.6deg,
        rgba(var(--pp-grain), .10) 0 1px, transparent 1px 6px,
        rgba(var(--pp-grain), .06) 6px 8px, transparent 8px 13px,
        rgba(var(--pp-grain), .13) 13px 14px, transparent 14px 23px),
      repeating-linear-gradient(181.2deg, rgba(255,230,190,.07) 0 3px, transparent 3px 17px),
      linear-gradient(180deg, var(--pp-wood-hi), var(--pp-wood));
    border-radius: 14px;
    padding: clamp(10px, 2.6vw, 18px);
    box-shadow:
      inset 0 1px 0 rgba(255,235,200,.55),
      inset 0 -4px 0 rgba(90,45,10,.35),
      inset 0 0 0 1px rgba(90,45,10,.35),
      0 16px 30px -14px rgba(60,30,5,.6);
  }
  .pp-board {
    display: grid;
    grid-template-columns: repeat(11, 1fr);
    gap: var(--gap);
  }
  .pp-cell {
    position: relative;               /* no z-index: stones and joins share the board's stacking context */
    aspect-ratio: 1;
    border: none; padding: 0; margin: 0;
    background: radial-gradient(120% 120% at 50% 30%, color-mix(in srgb, var(--pp-well) 80%, black), var(--pp-well));
    border-radius: 30%;
    box-shadow: inset 0 3px 4px rgba(40,15,0,.55), inset 0 -1px 0 rgba(255,225,180,.35), 0 1px 0 rgba(255,230,190,.35);
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .pp-cell:focus-visible { outline: 3px solid var(--pp-accent); outline-offset: 2px; }

  /* Stones: glossy, irregular, joined to same-piece neighbours by bridges. */
  .pp-stone {
    position: absolute; inset: 5%;
    z-index: 1;
    border-radius: var(--shape);
    transform: rotate(var(--tilt)) scale(var(--sx, 1), var(--sy, 1));
    background:
      radial-gradient(60% 45% at 34% 24%, rgba(255,255,255,.95) 0%, rgba(255,255,255,.35) 45%, transparent 72%),
      radial-gradient(130% 120% at 45% 35%, color-mix(in srgb, var(--c) 80%, white) 0%, var(--c) 45%, color-mix(in srgb, var(--c) 58%, black) 100%);
    box-shadow:
      0 3px 4px rgba(45,20,0,.5),
      inset 0 -3px 5px color-mix(in srgb, var(--c) 50%, black),
      0 0 10px -2px color-mix(in srgb, var(--c) 70%, transparent);
  }
  @media (prefers-reduced-motion: no-preference) {
    .pp-board.popping .pp-stone { animation: pp-pop .38s cubic-bezier(.3,1.6,.5,1) both; animation-delay: var(--delay, 0ms); }
    @keyframes pp-pop {
      from { transform: rotate(var(--tilt)) scale(0); }
      to   { transform: rotate(var(--tilt)) scale(var(--sx, 1), var(--sy, 1)); }
    }
  }
  .pp-cell.jr::before, .pp-cell.jd::after {
    content: "";
    position: absolute;
    z-index: 0;
    background: color-mix(in srgb, var(--c) 70%, #2a1405);
    border-radius: 3px;
  }
  .pp-cell.jr::before { left: 50%; top: 33%; height: 34%; width: calc(100% + var(--gap)); }
  .pp-cell.jd::after  { top: 50%; left: 33%; width: 34%; height: calc(100% + var(--gap)); }

  .pp-cell.ghost .pp-stone {
    background: color-mix(in srgb, var(--c) 45%, transparent);
    box-shadow: none;
    outline: 2px dashed rgba(255,255,255,.9);
    outline-offset: -2px;
  }
  .pp-cell.ghost.jr::before, .pp-cell.ghost.jd::after { background: rgba(255,255,255,.55); }

  /* ---- Piece tray ---- */
  .pp-traybar { display: flex; flex-direction: column; gap: 10px; }
  .pp-traylabel { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; color: var(--pp-ink-soft); }
  .pp-traylabel strong { color: var(--pp-ink); font-weight: 600; }
  .pp-tray {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(78px, 1fr));
    gap: 8px;
  }
  .pp-piece {
    background: var(--pp-card);
    border: 1.5px solid var(--pp-line);
    border-radius: 14px;
    min-height: 78px;
    padding: 10px 6px;
    display: grid; place-items: center;
    cursor: pointer;
    font: inherit; color: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  .pp-piece[aria-pressed="true"] {
    border-color: var(--pp-accent);
    box-shadow: 0 0 0 2px var(--pp-accent), 0 6px 14px -8px rgba(0,0,0,.5);
    transform: translateY(-2px);
  }
  .pp-piece:focus-visible { outline: 3px solid var(--pp-accent); outline-offset: 2px; }
  .pp-traynote { grid-column: 1 / -1; margin: 0; padding: 14px 0; color: var(--pp-ink-soft); font-size: 15px; }
  .pp-mini {
    --gap: 2px;
    display: grid;
    gap: var(--gap);
    grid-template-columns: repeat(var(--cols), var(--u));
    grid-auto-rows: var(--u);
    --u: 13px;
  }
  .pp-mini .pp-cell { background: transparent; box-shadow: none; aspect-ratio: auto; cursor: inherit; }
  .pp-mini .pp-empty { visibility: hidden; }

  /* ---- Buttons ---- */
  .pp-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .pp-btn {
    font: inherit; font-size: 15px; font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    min-height: 44px;
    padding: 0 16px;
    border-radius: 12px;
    border: 1.5px solid var(--pp-line);
    background: var(--pp-card);
    color: var(--pp-ink);
    cursor: pointer;
    flex: 1 1 auto;
  }
  .pp-btn svg { width: 18px; height: 18px; flex: none; }
  .pp-btn.primary { background: var(--pp-ink); border-color: var(--pp-ink); color: var(--pp-ground); }
  .pp-btn:disabled { opacity: .4; cursor: default; }
  .pp-btn:focus-visible { outline: 3px solid var(--pp-accent); outline-offset: 2px; }

  .pp-setup {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px;
    padding-top: 16px;
    border-top: 1.5px solid var(--pp-line);
  }
  .pp-setup label { flex: 1 1 220px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--pp-ink-soft); }
  .pp-setup label strong { color: var(--pp-ink); font-variant-numeric: tabular-nums; }
  .pp-setup input[type="range"] { width: 100%; accent-color: var(--pp-accent); min-height: 28px; }
  .pp-setup .pp-btn { flex: 0 0 auto; }

  .pp-status { margin: -8px 0 0; min-height: 3em; font-size: 15px; line-height: 1.5; color: var(--pp-ink-soft); }   /* two lines reserved so the tray doesn't jump */

  @media (prefers-reduced-motion: no-preference) {
    .pp-piece { transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease, opacity .15s ease; }
  }

  /* ---- Placing: drag and tap ---- */
  .pp-board, .pp-tray { user-select: none; -webkit-user-select: none; }
  .pp-board .pp-cell, .pp-piece { touch-action: none; }   /* let a finger drag pieces instead of scrolling */
  .pp-cell.mine { cursor: grab; }
  .pp-piece.lifting { opacity: .3; }
  body.pp-dragging, body.pp-dragging * { cursor: grabbing !important; }

  .pp-cell.ghost.bad .pp-stone {
    background: rgba(255, 70, 70, .35);
    outline-color: #ff5252;
  }
  .pp-cell.ghost.bad.jr::before, .pp-cell.ghost.bad.jd::after { background: rgba(255, 90, 90, .65); }
  .pp-cell.clash { outline: 2.5px dashed #ff5252; outline-offset: 1px; }

  /* ---- Hint, Check and the win ---- */
  .pp-status[hidden], .pp-win[hidden] { display: none; }
  .pp-win {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 12px 16px;
    margin-top: -8px;
    padding: 14px 16px;
    border-radius: 14px;
    background: var(--pp-card);
    border: 1.5px solid var(--pp-accent);
    box-shadow: 0 10px 24px -14px rgba(60, 30, 5, .55);
  }
  .pp-wintitle { margin: 0; font-family: var(--pp-display); font-size: 26px; font-weight: 800; line-height: 1.1; }
  .pp-winline { margin: 4px 0 0; color: var(--pp-ink-soft); font-size: 15px; }
  .pp-win .pp-row { flex: 0 1 auto; }
  .pp-winbest { margin-top: 2px; color: var(--pp-ink); font-weight: 600; }
  .pp-winbest:empty { display: none; }

  @media (prefers-reduced-motion: no-preference) {
    /* Win: every stone hops in a wave from left to right. */
    .pp-board.cheering .pp-stone { animation: pp-hop .6s cubic-bezier(.3, .7, .4, 1) both; animation-delay: var(--delay, 0ms); }
    @keyframes pp-hop {
      0%, 100% { transform: rotate(var(--tilt)) scale(var(--sx, 1), var(--sy, 1)); }
      40%      { transform: translateY(-38%) rotate(var(--tilt)) scale(1.08); }
    }
    /* Hint: the new stone glints. */
    .pp-cell.hinted .pp-stone { animation: pp-glint 1.4s ease-out both; }
    @keyframes pp-glint {
      0%   { box-shadow: 0 0 0 0 rgba(255,255,255,.95), 0 0 18px 6px rgba(255,214,90,.9); }
      100% { box-shadow: 0 3px 4px rgba(45,20,0,.5), 0 0 0 0 rgba(255,214,90,0); }
    }
    /* Check: a green ripple when it's still solvable, a red shake when it's stuck. */
    .pp-wood.flash-good { animation: pp-good .9s ease-out; }
    .pp-wood.flash-bad  { animation: pp-bad-ring .9s ease-out, pp-shake .45s ease-in-out; }
    @keyframes pp-good     { from { outline: 3px solid rgba(69,198,82,.95); outline-offset: 2px; } to { outline: 3px solid rgba(69,198,82,0); outline-offset: 14px; } }
    @keyframes pp-bad-ring { from { outline: 3px solid rgba(236,40,67,.95); outline-offset: 2px; } to { outline: 3px solid rgba(236,40,67,0); outline-offset: 14px; } }
    @keyframes pp-shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
  }

  .pp-floater {
    position: fixed; left: 0; top: 0;
    z-index: 50;
    pointer-events: none;
    filter: drop-shadow(0 12px 14px rgba(40, 20, 0, .4));
    will-change: transform;
  }
</style>

<body>
<main>
  <div class="pp-head">
    <div>
      <h1 class="pp-title">Pebblepack<span class="pip" aria-hidden="true"></span></h1>
      <p class="pp-sub">Fit every remaining stone onto the board. No gaps, no overlaps.</p>
    </div>
    <div class="pp-stats">
      <div>Time<b id="pp-time">0:00</b></div>
      <div>Best<b id="pp-best">–</b></div>
      <div>Stones<b id="pp-count">0/12</b></div>
    </div>
  </div>

  <div class="pp-wood"><div class="pp-board" id="pp-board" role="grid" aria-label="Board, 5 rows by 11 columns"></div></div>
  <p class="pp-status" id="pp-status" role="status"></p>
  <div class="pp-win" id="pp-win" role="status" hidden>
    <div>
      <p class="pp-wintitle">Solved!</p>
      <p class="pp-winline" id="pp-winline"></p>
      <p class="pp-winline pp-winbest" id="pp-winbest"></p>
    </div>
    <div class="pp-row">
      <button class="pp-btn" id="pp-win-close">Close</button>
      <button class="pp-btn primary" id="pp-win-new">New puzzle</button>
    </div>
  </div>

  <div class="pp-traybar">
    <div class="pp-traylabel"><span>Your stones</span><strong id="pp-selname"></strong></div>
    <div class="pp-tray" id="pp-tray"></div>
    <div class="pp-row">
      <button class="pp-btn" id="pp-rotate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>Rotate</button>
      <button class="pp-btn" id="pp-flip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18"/><path d="M8 7 3 12l5 5V7Z"/><path d="m16 7 5 5-5 5V7Z"/></svg>Flip</button>
    </div>
  </div>

  <div class="pp-row">
    <button class="pp-btn" id="pp-undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>Undo</button>
    <button class="pp-btn" id="pp-hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3Z"/></svg>Hint</button>
    <button class="pp-btn" id="pp-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5L20 7"/></svg>Check</button>
  </div>

  <div class="pp-setup">
    <label for="pp-start">Stones already on the board: <strong id="pp-startval">5</strong>
      <input type="range" id="pp-start" min="0" max="11" step="1" value="5">
    </label>
    <button class="pp-btn primary" id="pp-new">New puzzle</button>
  </div>
</main>

<script src="engine.js"></script>
<script src="game.js"></script>
